<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Patient Registration | HMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f9b8e, #6ae7d8);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
        }

        .register-card {
            width: 420px;
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .title {
            text-align: center;
            color: #0f9b8e;
            font-weight: 700;
            font-size: 28px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-register {
            background: linear-gradient(135deg, #0f9b8e, #3cd6c8);
            border: none;
            padding: 12px;
            color: #fff;
            border-radius: 50px;
            font-weight: 600;
        }

        .btn-register:hover {
            background: #0c897a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-weight: 600;
            color: #0f9b8e;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .alert {
            font-size: 14px;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="register-card">

        <h3 class="title">
            <i class="fa-solid fa-user-plus"></i> Patient Registration
        </h3>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                <div class="alert alert-{{ category }}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/register_patient">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="name" required
                    placeholder="Enter full name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" name="email" required
                    placeholder="Enter email">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control" name="phone"
                    placeholder="Enter phone number">
            </div>

            <div class="mb-3">
                <label class="form-label">Create Password</label>
                <input type="password" class="form-control" name="password" required
                    placeholder="Enter password">
            </div>

            <button type="submit" class="btn-register w-100 mt-3">
                <i class="fa-solid fa-check"></i> Register
            </button>

        </form>

        <a href="/" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>

    </div>

</body>

</html>
