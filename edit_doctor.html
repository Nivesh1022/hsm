<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor | HMS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
        }

        .edit-card {
            max-width: 550px;
            margin: 60px auto;
            padding: 25px;
            border-radius: 15px;
            background: #ffffff;
            box-shadow: 0 0 18px rgba(0,0,0,0.1);
        }

        h3 {
            color: #0066cc;
            font-weight: 700;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
        }

        .btn-primary {
            background: #007bff;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-secondary {
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: 600;
        }

    </style>
</head>
<body>

    <div class="edit-card">
        <h3 class="text-center">Edit Doctor Details</h3>

        <form action="/edit_doctor/{{ doctor.id }}" method="POST">

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Doctor Name</label>
                <input type="text" name="name" class="form-control" value="{{ doctor.name }}" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Doctor Email</label>
                <input type="email" name="email" class="form-control" value="{{ doctor.email }}" required>
            </div>

            <!-- Specialization -->
            <div class="mb-3">
                <label class="form-label">Specialization</label>
                <input type="text" name="specialization" class="form-control" value="{{ doctor.specialization }}" required>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="/admin_dashboard" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Doctor</button>
            </div>

        </form>

    </div>

</body>
</html>
