<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Login | HMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #0f9b8e, #6ae7d8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .open-btn {
            padding: 18px 40px;
            background: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            color: #0f9b8e;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            transition: 0.3s ease-in-out;
        }

        .open-btn:hover {
            transform: scale(1.05);
            background: #ebfffc;
        }

        .modal-content {
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: none;
        }

        .modal-header-custom {
            background: linear-gradient(135deg, #0f9b8e, #3ccfc0);
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .btn-login {
            background: linear-gradient(135deg, #0f9b8e, #3cd6c8);
            border: none;
            padding: 12px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #0c8378;
        }
    </style>
</head>

<body>

<button class="open-btn" data-bs-toggle="modal" data-bs-target="#loginModal">
    <i class="fa-solid fa-user-shield"></i> Login
</button>

<div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header-custom">
                <i class="fa-solid fa-hospital fa-3x"></i>
                <h4>CityCare Hospital</h4>
                <small>Secure Login Portal</small>
            </div>

            <div class="modal-body">

                <!-- ALWAYS post to /login -->
                <form id="loginForm" method="POST" action="/login">

                    <div class="mb-3">
                        <label class="form-label">Select Role</label>
                        <select id="roleSelect" name="role" class="form-select" required>
                            <option value="">-- Choose Role --</option>
                            <option value="patient">Patient</option>
                            <option value="doctor">Doctor</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email or Username</label>
                        <input type="text" class="form-control" name="email_or_name"
                               placeholder="Enter email or name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                    </div>

                    <div class="d-grid mt-3">
                        <button type="submit" class="btn-login">Login</button>
                    </div>

                </form>

            </div>

            <div class="modal-footer text-center w-100">
                <small>Don't have an account?</small>

                <div class="mt-2 d-flex justify-content-center gap-3">

                    <a href="/register_patient" class="btn btn-outline-primary btn-sm">
                        Register as Patient
                    </a>

                    <a href="/register_doctor" class="btn btn-outline-success btn-sm">
                        Register as Doctor
                    </a>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
